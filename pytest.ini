[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --cov=workshop/solution
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
    --html=test-reports/report.html
    --self-contained-html

[coverage:run]
source = workshop/solution
omit = 
    */tests/*
    */test_*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    class .*\(Protocol\):
    @(abc\.)?abstractmethod